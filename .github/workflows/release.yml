name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test (парсер против общих фикстур)
        working-directory: windows
        run: go test ./...
      - name: Build exe
        working-directory: windows
        run: go build -trimpath -ldflags "-s -w" -o dist/vpn-client.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: windows/dist/vpn-client.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
      - name: Build APK (debug)
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Собрать артефакты и контрольные суммы
        run: |
          mkdir -p dist
          cp windows-exe/vpn-client.exe dist/
          cp android-apk/app-debug.apk dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
