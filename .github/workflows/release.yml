name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  XRAY_VERSION: v26.3.27

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Тесты (парсер против общих фикстур)
        working-directory: windows
        run: go test ./...
      - name: Сборка vpn-client.exe
        working-directory: windows
        run: go build -trimpath -ldflags "-s -w" -o dist/vpn-client.exe .
      - name: Ядро Xray-core + tun2socks рядом с exe
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/download/$env:XRAY_VERSION/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath windows/dist -Force
          Invoke-WebRequest "https://github.com/xjasonlyu/tun2socks/releases/download/v2.7.0/tun2socks-windows-amd64.zip" -OutFile tun2socks.zip
          Expand-Archive tun2socks.zip -DestinationPath windows/dist -Force
          Move-Item windows/dist/tun2socks-windows-amd64.exe windows/dist/tun2socks.exe -Force
      - name: Упаковка zip (exe + ядро + tun2socks + лицензии)
        shell: pwsh
        run: |
          $out = "windows/dist/vpn-client-windows.zip"
          $lic = "windows/dist/THIRD-PARTY-LICENSES"
          New-Item -ItemType Directory -Path $lic -Force | Out-Null
          Copy-Item LICENSE, NOTICE $lic
          Copy-Item windows/dist/LICENSE-wintun.txt $lic -ErrorAction SilentlyContinue
          Compress-Archive -Path "windows/dist/vpn-client.exe","windows/dist/xray.exe","windows/dist/geoip.dat","windows/dist/geosite.dat","windows/dist/wintun.dll","windows/dist/tun2socks.exe","$lic" -DestinationPath $out -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: windows/dist/vpn-client-windows.zip

  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK (debug)
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Артефакты и контрольные суммы
        run: |
          mkdir -p dist
          cp windows-package/vpn-client-windows.zip dist/
          cp android-apk/app-debug.apk dist/ 2>/dev/null || true
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
