name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: go vet
        working-directory: windows
        run: go vet ./...
      - name: go test (парсер против общих фикстур)
        working-directory: windows
        run: go test ./...
      - name: Сборка vpn-client.exe
        working-directory: windows
        run: go build -trimpath -ldflags "-s -w" -o dist/vpn-client.exe .
      - name: Ядро Xray-core + tun2socks рядом с exe
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath windows/dist -Force
          Invoke-WebRequest "https://github.com/xjasonlyu/tun2socks/releases/download/v2.7.0/tun2socks-windows-amd64.zip" -OutFile tun2socks.zip
          Expand-Archive tun2socks.zip -DestinationPath windows/dist -Force
          Move-Item windows/dist/tun2socks-windows-amd64.exe windows/dist/tun2socks.exe -Force
      - uses: actions/upload-artifact@v4
        with:
          name: vpn-client-windows
          path: |
            windows/dist/vpn-client.exe
            windows/dist/xray.exe
            windows/dist/geoip.dat
            windows/dist/geosite.dat
            windows/dist/wintun.dll
            windows/dist/tun2socks.exe

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: assembleDebug
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
