name: release-macos

# Сборка macOS-версии (Apple Silicon) и загрузка DMG + артефакта обновления
# в GitHub Release. Запускается на тег v* или вручную для существующего тега.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например v1.0.10)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Ядро туннеля (Xray + tun2socks)
        run: |
          chmod +x tools/fetch-core.sh
          ./tools/fetch-core.sh

      - name: Сборка DMG и артефакта обновления
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          EXTRA=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > updater.json
            EXTRA="--config $(pwd)/updater.json"
            echo "Подпись обновлений: ВКЛ"
          else
            echo "Подпись обновлений: ВЫКЛ (нет секрета)"
          fi
          npx --yes "@tauri-apps/cli@^2" build $EXTRA

      - name: Подготовка ассетов
        id: assets
        run: |
          VER=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          DMG=$(ls target/release/bundle/dmg/*.dmg | head -n 1)
          OUT="VPN_${VER}_aarch64.dmg"
          cp "$DMG" "$OUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

          UP=$(ls target/release/bundle/macos/*.app.tar.gz 2>/dev/null | head -n 1 || true)
          if [ -n "$UP" ] && [ -f "$UP.sig" ]; then
            UPOUT="VPN_${VER}_aarch64.app.tar.gz"
            cp "$UP" "$UPOUT"
            cp "$UP.sig" "$UPOUT.sig"
            echo "updater=$UPOUT" >> "$GITHUB_OUTPUT"
          fi

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          FILES=( "${{ steps.assets.outputs.file }}" )
          if [ -n "${{ steps.assets.outputs.updater }}" ]; then
            FILES+=( "${{ steps.assets.outputs.updater }}" "${{ steps.assets.outputs.updater }}.sig" )
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "VPN $TAG" --notes "VPN ${{ steps.assets.outputs.ver }}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"

      - name: latest.json (darwin-aarch64)
        if: ${{ steps.assets.outputs.updater != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VER: ${{ steps.assets.outputs.ver }}
          ASSET: ${{ steps.assets.outputs.updater }}
        run: |
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          if curl -fsSL "$BASE/latest.json" -o prev.json; then
            :
          else
            echo '{"platforms":{}}' > prev.json
          fi
          URL="$BASE/$ASSET"
          SIG="$(cat "$ASSET.sig")" URL="$URL" VER="$VER" node -e '
            const fs = require("fs");
            const cur = JSON.parse(fs.readFileSync("prev.json", "utf8"));
            const platforms = cur.platforms || {};
            platforms["darwin-aarch64"] = {
              signature: process.env.SIG.trim(),
              url: process.env.URL,
            };
            const out = {
              version: process.env.VER,
              notes: "VPN " + process.env.VER,
              pub_date: new Date().toISOString(),
              platforms,
            };
            fs.writeFileSync("latest.json", JSON.stringify(out, null, 2) + "\n");
          '
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber latest.json
