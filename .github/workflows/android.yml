name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "tools/fetch-core-android.*"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "tools/fetch-core-android.*"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKM" ]; then
            echo "sdkmanager не найден в $SDK" >&2
            exit 1
          fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Ядро туннеля (Xray + tun2socks)
        run: |
          chmod +x tools/fetch-core-android.sh
          ./tools/fetch-core-android.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты и сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vpn-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
